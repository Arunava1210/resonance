name: Rust checks

on:
  push:
    branches:
      - main
      - rust-native-performance
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compile and test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gettext \
            libdbus-1-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-4-dev

      - name: Install Python 3.11 for the existing PyO3 bridge
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure PyO3 interpreter
        run: echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked
