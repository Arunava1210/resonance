name: Rust checks

on:
  push:
    branches:
      - main
      - rust-native-performance
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Compile and test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Meson
        run: sudo apt-get install --no-install-recommends -y meson

      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gettext \
            desktop-file-utils \
            libdbus-1-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-4-dev

      - name: Install Python 3.11 for the optional legacy importer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure PyO3 interpreter
        run: echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Meson build configuration
        run: meson setup build --prefix=/usr

      - name: Check native Rust application
        run: cargo check --locked

      - name: Check optional legacy Python importer
        run: cargo check --locked --no-default-features --features python-importer

      - name: Commit generated lockfile on the development branch
        if: github.event_name == 'push' && github.ref_name == 'rust-native-performance'
        run: |
          # Another source commit may land while this job is building. Move
          # the commit base to the latest branch without discarding Cargo's
          # generated lockfile, then commit only Cargo.lock.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --mixed "origin/${GITHUB_REF_NAME}"
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Update Cargo.lock for native metadata importer"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fetch small real-audio parser fixtures
        run: |
          set -eu
          fixtures=/tmp/resonance-audio-fixtures
          mkdir -p "$fixtures"
          base=https://raw.githubusercontent.com/bakgio/audex/0aaad9e0364405170ef42af3a071a905dc623dda/tests/data
          for file in silence-44-s.mp3 silence-44-s.flac multipagecomment.ogg example.opus with-id3.aif alac.m4a silence-1.wma covr-with-name.m4a; do
            curl -fsSL "$base/$file" -o "$fixtures/$file"
          done
          cp "$fixtures/with-id3.aif" "$fixtures/with-id3.aiff"
          cp "$fixtures/silence-1.wma" "$fixtures/sample.asf"
          cp "$fixtures/silence-1.wma" "$fixtures/sample.wmv"
          cp "$fixtures/alac.m4a" "$fixtures/alac.mp4"
          echo "RESONANCE_AUDIO_FIXTURES=$fixtures" >> "$GITHUB_ENV"

      - name: Run tests
        run: cargo test --locked
