name: Linux build and tests

on:
  push:
    branches: [rust-native-importer]
  pull_request:
    branches: [rust-native-importer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resonance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config meson ninja-build gettext desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-good1.0-dev gstreamer1.0-plugins-good libgstreamer-plugins-bad1.0-dev \
            python3-dev libsqlite3-dev libssl-dev

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Configure Meson
        run: meson setup build --prefix=/usr --buildtype=release

      - name: Build Resonance
        run: meson compile -C build

      - name: Upload resolved Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resonance-cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

